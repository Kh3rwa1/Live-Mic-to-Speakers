plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'demo.ads'
    compileSdk 37
    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            def localProperties = new Properties()
            def localFile = rootProject.file('local.properties')
            if (localFile.exists()) {
                localFile.withInputStream { localProperties.load(it) }
            }
            def testDevices = providers.gradleProperty('LIVE_MIC_TEST_DEVICE_IDS')
                    .orElse(providers.environmentVariable('LIVE_MIC_TEST_DEVICE_IDS'))
                    .getOrElse(localProperties.getProperty('LIVE_MIC_TEST_DEVICE_IDS', ''))
            buildConfigField 'String', 'TEST_DEVICE_IDS', "\"${testDevices}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'TEST_DEVICE_IDS', '""'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.lifecycle.process
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation libs.play.services.ads
    implementation libs.facebook.mediation
    implementation libs.ump

    constraints {
        implementation(libs.viewpager2) {
            because 'Use the stable ViewPager2 release instead of the transitive 1.1.0-beta02 request.'
        }
    }
}
