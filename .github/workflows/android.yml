name: Android reliability checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify core accessibility source contract
        run: python3 tools/check_quality_contract.py
      - name: Audit file-sharing consumers
        run: git grep -n -E 'FileProvider|getUriForFile|FLAG_GRANT_(READ|WRITE)_URI_PERMISSION|ACTION_IMAGE_CAPTURE' -- '*.java' '*.kt' '*Manifest.xml' > fileprovider-audit.txt || test "$?" = 1
      - name: Verify production release rejects missing configuration
        run: |
          if bash ./gradlew --no-daemon :app:verifyProductionRelease -PproductionRelease=false > production-gate.log 2>&1; then
            echo 'Production gate unexpectedly accepted a demo configuration'; exit 1
          fi
          grep -q 'Production release blocked' production-gate.log
          if bash ./gradlew --no-daemon :app:verifyProductionRelease -PproductionRelease=true >> production-gate.log 2>&1; then
            echo 'Production gate unexpectedly accepted missing settings'; exit 1
          fi
          grep -q 'Configure a non-test LIVE_MIC_ADMOB_APP_ID' production-gate.log
      - name: App and ads unit tests, lint and debug/release builds
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:testReleaseUnitTest :ads:testDebugUnitTest :ads:testReleaseUnitTest :app:lintDebug :app:lintRelease :ads:lintDebug :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ads/build/reports/
            ads/build/test-results/
            build.log
            production-gate.log
            fileprovider-audit.txt
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: live-mic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            font: '1.0'
          - api: 34
            font: '1.0'
          - api: 36
            font: '1.0'
          - api: 36
            font: '2.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash tools/run_device_checks.sh '${{ matrix.font }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports-api-${{ matrix.api }}-font-${{ matrix.font }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/quality-screenshots/
            device-test.log
          if-no-files-found: ignore
  failure-diagnostics:
    # This isolated reporter never checks out or executes the application's code.
    needs: [build-and-test, device-smoke]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Summarize failed jobs without weakening checks
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', {
              ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            const failed = jobs.filter(job => job.conclusion === 'failure' || job.conclusion === 'timed_out');
            if (!failed.length) return;
            const sections = [];
            for (const job of failed.slice(0, 5)) {
              let excerpt = '';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  ...context.repo, job_id: job.id
                });
                const log = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                const lines = log.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
                const selected = new Set();
                lines.forEach((line, i) => {
                  if (/FAILED|AssertionError|ComparisonFailure|error:|What went wrong:|Error:|expected:|Unable to|No space left/.test(line)) {
                    for (let j = Math.max(0, i - 1); j < Math.min(lines.length, i + 7); j++) selected.add(j);
                  }
                });
                excerpt = [...selected].sort((a, b) => a - b).map(i => lines[i]).join('\n').slice(0, 6500);
                excerpt = excerpt.replace(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/g, '[redacted]').replace(/```/g, "'''");
              } catch (error) {
                excerpt = 'Log retrieval unavailable; inspect the linked job and uploaded reports.';
              }
              const steps = (job.steps || []).filter(step => step.conclusion === 'failure').map(step => step.name).join(', ');
              sections.push('### ' + job.name + '\nFailed step: ' + (steps || job.conclusion) + '\n[Job details](' + job.html_url + ')\n```text\n' + (excerpt || 'No concise diagnostic matched; inspect the full log.') + '\n```');
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: '## Android verification diagnostics\nSource commit: `' + context.payload.pull_request.head.sha + '`\n\n' + sections.join('\n\n')
            });
