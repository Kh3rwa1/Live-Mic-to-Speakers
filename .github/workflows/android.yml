name: Android reliability checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Prepare SDK tools for Android 17 package names
        run: bash tools/prepare_android_sdk.sh
      - name: Verify CI helper regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify core accessibility source contract
        run: python3 tools/check_quality_contract.py
      - name: Audit file-sharing consumers
        run: git grep -n -E 'FileProvider|getUriForFile|FLAG_GRANT_(READ|WRITE)_URI_PERMISSION|ACTION_IMAGE_CAPTURE' -- '*.java' '*.kt' '*Manifest.xml' > fileprovider-audit.txt || test "$?" = 1
      - name: Verify production release rejects missing configuration
        run: |
          if bash ./gradlew --no-daemon :app:verifyProductionRelease -PproductionRelease=false > production-demo-gate.log 2>&1; then
            echo 'Production gate unexpectedly accepted a demo configuration'; exit 1
          fi
          grep -q 'Production release blocked' production-demo-gate.log || { tail -n 100 production-demo-gate.log; exit 1; }
          if bash ./gradlew --no-daemon :app:verifyProductionRelease -PproductionRelease=true > production-missing-gate.log 2>&1; then
            echo 'Production gate unexpectedly accepted missing settings'; exit 1
          fi
          grep -q 'Configure a non-test LIVE_MIC_ADMOB_APP_ID' production-missing-gate.log || { tail -n 100 production-missing-gate.log; exit 1; }
      - name: App and ads unit tests, lint and debug/release builds
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:testReleaseUnitTest :ads:testDebugUnitTest :ads:testReleaseUnitTest :app:lintDebug :app:lintRelease :ads:lintDebug :app:assembleDebug :app:assembleRelease :app:writeDependencyInventory 2>&1 | tee build.log
      - name: Verify resolved runtime dependency support policy
        run: python3 tools/check_dependency_policy.py app/build/reports/runtime-dependencies.json
      - name: Verify release native-library alignment
        run: |
          set -euo pipefail
          python3 tools/check_native_alignment.py app/build/outputs/apk/release/*.apk --report app/build/reports/native-alignment.json
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          test -n "$zipalign"
          for apk in app/build/outputs/apk/release/*.apk; do "$zipalign" -c -P 16 -v 4 "$apk"; done > native-zip-alignment.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ads/build/reports/
            ads/build/test-results/
            build.log
            production-*-gate.log
            fileprovider-audit.txt
            native-zip-alignment.log
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-mic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            font: '1.0'
          - api: 34
            font: '1.0'
          - api: 36
            font: '1.0'
          - api: 36
            font: '2.0'
          - api: 37
            font: '1.0'
          - api: 37
            font: '2.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Prepare SDK tools for Android 17 package names
        run: bash tools/prepare_android_sdk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api == 37 && '37.0' || matrix.api }}
          target: ${{ matrix.api == 37 && 'google_apis_ps16k' || 'default' }}
          ram-size: ${{ matrix.api == 37 && '4096M' || '' }}
          arch: x86_64
          disable-animations: true
          pre-emulator-launch-script: |
            if [ '${{ matrix.api }}' = '37' ]; then grep -qx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini" || { echo 'Error: AVD target was not parsed as Android 37.0'; exit 1; }; fi
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '${{ matrix.api }}' || { echo 'Error: emulator API differs from requested matrix'; exit 1; }
            if [ '${{ matrix.api }}' = '37' ]; then test "$(adb shell getconf PAGESIZE | tr -d '\r')" = '16384' || { echo 'Error: Android 17 image is not running with 16 KiB pages'; exit 1; }; fi
            bash tools/run_device_checks.sh '${{ matrix.font }}'
      - name: Print failing Android test details
        if: always()
        run: python3 tools/summarize_android_failures.py app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device-reports-api-${{ matrix.api }}-font-${{ matrix.font }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/quality-screenshots/
            device-test.log
          if-no-files-found: ignore
  failure-diagnostics:
    # This isolated reporter never checks out or executes the application's code.
    needs: [build-and-test, device-smoke]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Summarize failed jobs without weakening checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', {
              ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            const failed = jobs.filter(job => job.conclusion === 'failure' || job.conclusion === 'timed_out');
            if (!failed.length) return;
            const sections = [];
            for (const job of failed.slice(0, 5)) {
              let excerpt = '';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  ...context.repo, job_id: job.id
                });
                const log = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                const lines = log.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
                const selected = new Set();
                lines.forEach((line, i) => {
                  if (/FAILED|AssertionError|ComparisonFailure|error:|What went wrong:|Error:|expected:|Unable to|No space left|Failed to find package|Package path is not valid|Failed to install|Warning:.*package/.test(line)) {
                    for (let j = Math.max(0, i - 1); j < Math.min(lines.length, i + 7); j++) selected.add(j);
                  }
                });
                // Keep recent failures rather than letting SDK setup warnings consume the excerpt.
                excerpt = [...selected].sort((a, b) => a - b).map(i => lines[i]).join('\n');
                excerpt = excerpt.replace(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/g, '[redacted]').replace(/```/g, "'''").slice(-10000);
              } catch (error) {
                excerpt = 'Log retrieval unavailable; inspect the linked job and uploaded reports.';
              }
              const steps = (job.steps || []).filter(step => step.conclusion === 'failure').map(step => step.name).join(', ');
              sections.push('### ' + job.name + '\nFailed step: ' + (steps || job.conclusion) + '\n[Job details](' + job.html_url + ')\n```text\n' + (excerpt || 'No concise diagnostic matched; inspect the full log.') + '\n```');
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: '## Android verification diagnostics\nSource commit: `' + context.payload.pull_request.head.sha + '`\n\n' + sections.join('\n\n')
            });
