name: Android reliability checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit file-sharing consumers
        run: git grep -n -E 'FileProvider|getUriForFile|FLAG_GRANT_(READ|WRITE)_URI_PERMISSION|ACTION_IMAGE_CAPTURE' -- '*.java' '*.kt' '*Manifest.xml' > fileprovider-audit.txt || test "$?" = 1
      - name: App and ads unit tests, lint and debug/release builds
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:testReleaseUnitTest :ads:testDebugUnitTest :ads:testReleaseUnitTest :app:lintDebug :app:lintRelease :ads:lintDebug :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ads/build/reports/
            ads/build/test-results/
            build.log
            fileprovider-audit.txt
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: live-mic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
