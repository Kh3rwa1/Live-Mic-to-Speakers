name: Android reliability checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Temporary diagnostic statuses; remove this write scope after build verification.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug and release builds, lint and regression checks
        id: build
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:testReleaseUnitTest :ads:testDebugUnitTest :ads:testReleaseUnitTest :app:lintDebug :app:lintRelease :ads:lintDebug :app:assembleDebug :app:assembleRelease 2>&1 | tee android-build.log
      - name: Expose concise build diagnostics on this commit
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('android-build.log') ? fs.readFileSync('android-build.log', 'utf8') : '';
            const lines = log.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
            const messages = [];
            for (let i = 0; i < lines.length; i++) {
              if (/error:|Error:|Execution failed for task| > .* FAILED/.test(lines[i])) {
                const details = [lines[i], lines[i + 2], lines[i + 3]].filter(Boolean).join(' ');
                const clean = details.replace(/\/home\/runner\/work\/[^/]+\/[^/]+\//g, '').replace(/gh[a-z]_[A-Za-z0-9_]+/g, '[redacted]').replace(/[^\x20-\x7e]/g, ' ').replace(/\s+/g, ' ').trim();
                if (!messages.includes(clean)) messages.push(clean);
              }
            }
            const passed = process.env.BUILD_OUTCOME === 'success';
            for (let i = 0; i < 5; i++) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: context.sha,
                state: passed ? 'success' : 'failure',
                context: `ci/build-detail-${i + 1}`,
                description: (passed ? 'Debug/release builds, lint and JVM checks passed' : messages[i] || 'Build failed; see the workflow job and uploaded reports').slice(0, 140),
                target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ads/build/reports/
            ads/build/test-results/
            android-build.log
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: live-mic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
